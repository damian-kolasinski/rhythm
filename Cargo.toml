[workspace]
resolver = "3"
members = ["crates/rhythm-ui"]
default-members = ["."]

[package]
name = "rhythm"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Find, record, and surface the background jobs agents leave on a machine"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
plist = "1.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.27.0"

[dev-dependencies]
getrandom = "0.4.3"

[lints.clippy]
all = "warn"

[profile.release]
strip = "debuginfo"

# Keep these patches in sync with rune and rune-kit in crates/rhythm-ui.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
