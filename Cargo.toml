[package]
name = "rhythm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Discover and manage background work on one machine"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = "warn"
