min_version = "2026.10.11"

[tools]
python = "3.14.3"
rust = { version = "1.99.0", profile = "minimal", components = ["rustfmt", "clippy"] }
"github:jdx/packslip" = "1.11.1"
"github:rhysd/actionlint" = "1.7.12"
ruff = "0.17.3"

[tasks.build]
run = "cargo build --locked"

[tasks.check]
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "actionlint",
  "ruff check distribution",
  "ruff format --check distribution",
  "python -m unittest discover -s distribution -p 'test_*.py'",
]

[tasks.test]
run = "cargo test --locked"

[tasks."dist:build"]
run = "python distribution/package.py --build"

[tasks."dist:check"]
run = "python -m unittest discover -s distribution -p 'test_*.py'"

[tasks."dist:rehearse"]
run = "python distribution/rehearsal.py"
