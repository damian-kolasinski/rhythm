name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - distribution/**
      - mise.toml
      - mise.lock
      - Cargo.toml
      - Cargo.lock
      - src/**
      - web/**

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/plan.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    # Ship only the native target verified by this job; never cross-compile an untested release.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - run: mise run check
      - run: git diff --exit-code -- web/dist
      - run: cargo test --locked
      - run: mise run dist:build
      - run: pnpm --dir web exec playwright install chromium
      - name: Verify the packaged candidate and installed browser flows
        run: mise run dist:rehearse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhythm-aarch64-apple-darwin
          path: dist/rhythm-*.tar.gz
          if-no-files-found: error

  sign:
    needs: [plan, build]
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rhythm-aarch64-apple-darwin
          path: dist
      - id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859 # v1.11.1
        with:
          artifacts: dist/rhythm-*.tar.gz
          bin: rhythm
          tag: ${{ needs.plan.outputs.tag }}
          version: ${{ needs.plan.outputs.version }}
          commit: ${{ github.sha }}
          upload: false
          # Private repositories without Enterprise can sign with OIDC but cannot use GitHub's attestation service.
          attest: ${{ github.event.repository.private && 'false' || 'true' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    needs: [plan, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable versioned files together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --prerelease="$RELEASE_PRERELEASE" \
            --notes "Signed Rhythm release. Install this exact version through mise's packslip backend." \
            dist/rhythm-*.tar.gz dist/packslip.sigstore.json

  verify-published:
    needs: [plan, publish]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - run: mise run web:install
      - run: pnpm --dir web exec playwright install chromium
      - name: Install the published signature-verified release through mise and test it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python distribution/install.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --browser
