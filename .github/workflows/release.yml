name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/**
      - distribution/**
      - mise.toml
      - mise.lock
      - Cargo.toml
      - Cargo.lock
      - src/**
      - assets/**
      - crates/rhythm-ui/**
      # Embedded in the binary as the agent guide.
      - skill/**
      - docs/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 distribution/release_version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: The release commit belongs to reviewed main history
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tested:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _attempt in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            case "$result" in
              success) exit 0 ;;
              '') sleep 10 ;;
              *) printf 'Main CI concluded %s for this release commit.\n' "$result" >&2; exit 1 ;;
            esac
          done
          printf 'Main CI has not finished for this release commit.\n' >&2
          exit 1

  build:
    needs: [version, tested]
    if: always() && needs.version.result == 'success' && (needs.tested.result == 'success' || needs.tested.result == 'skipped')
    # Ship only the native target verified by this job; never cross-compile an untested release.
    runs-on: macos-15
    env:
      RHYTHM_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - run: mise run check
      - run: cargo test --workspace --locked
      - run: mise run dist:build
      - name: Verify the packaged candidate's installed flows
        run: mise run dist:rehearse
      - name: Open and uninstall the packaged desktop app
        run: mise exec -- python distribution/desktop_install.py --archive dist/rhythm-*.tar.gz
      - name: Stamp the release installer
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: mise exec -- python distribution/stamp_installer.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --out dist/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhythm-aarch64-apple-darwin
          path: |
            dist/rhythm-*.tar.gz
            dist/install.sh
          if-no-files-found: error

  sign:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rhythm-aarch64-apple-darwin
          path: dist
      - id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859 # v1.11.1
        with:
          artifacts: dist/rhythm-*.tar.gz
          bin: rhythm rhythm-ui
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          upload: false
          # Private repositories without Enterprise can sign with OIDC but cannot use GitHub's attestation service.
          attest: ${{ github.event.repository.private && 'false' || 'true' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable versioned files together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" \
            --prerelease="$RELEASE_PRERELEASE" \
            --notes "Signed Rhythm CLI and macOS app. Download install.sh to install both." \
            dist/rhythm-*.tar.gz dist/packslip.sigstore.json dist/install.sh

  verify-published:
    needs: [version, publish]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - name: Install the published signature-verified release through mise and test it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python distribution/install.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern install.sh --dir "$scratch"
          python distribution/desktop_install.py --installer "$scratch/install.sh"
